name: Secrets Lab

on:
  pull_request:
    branches: [main]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Print the variable
        run: echo "GREETING is ${{ vars.GREETING }}"

      - name: Print the secret directly
        env:
          AZURE_KEYVAULT: ${{ secrets.AZURE_KEYVAULT }}
        run: echo "$AZURE_KEYVAULT"

      - name: Print the secret length
        env:
          AZURE_KEYVAULT: ${{ secrets.AZURE_KEYVAULT }}
        run: echo "Length is ${#AZURE_KEYVAULT}"

      - name: Print the secret reversed
        env:
          AZURE_KEYVAULT: ${{ secrets.AZURE_KEYVAULT }}
        run: echo "$AZURE_KEYVAULT" | rev

      - name: Forget to pass the secret
        run: echo "Value is [$AZURE_KEYVAULT]"