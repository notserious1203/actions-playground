name: 'setup python'

input:
  python-version:
    default: '3.12'


runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with: 
        python-version: ${{input.python-version}}
      cahce: 'pip'
    - run: pip install requirements.txt
      shell: bash
    - run: python --version
      shell: bash