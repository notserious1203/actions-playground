name: 'setup python'
description: 'Set up Python and install requirements'

inputs:
  python-version:
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
    - run: pip install -r requirements.txt
      shell: bash
    - run: python --version
      shell: bash
